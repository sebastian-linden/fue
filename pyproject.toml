[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fue"
version = "0.1.0"
description = "A Python tool that tracks 14-day weather forecasts from the Open-Meteo API to see how they hold up over time. By comparing early predictions to the actual weather, it calculates the \"real\" uncertainty of a forecast. It’s built for hikers and outdoor enthusiasts who want to know if that 18°C Saturday is a sure thing or just a hopeful guess."
readme = "README.md"
authors = [
  {name = "Sebastian Linden", email = "sebastian.bennet.linden@rwth-aachen.de"}
]
maintainers = [
  {name = "Sebastian Linden", email = "sebastian.bennet.linden@rwth-aachen.de"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "numpy",
  "pandas",
  "openmeteo-requests",
  "requests-cache",
  "retry-requests",
  "seaborn",
  "ty>=0.0.30",
  "scikit-learn",
  "scipy",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "docs" },
    "pytest-cov>=7.1.0",
]
lint = [
    "ruff>=0.15.10",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "nbsphinx>=0.9.8",
    "sphinx",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-bibtex>=2.7.0",
]

[project.urls]
bugs = "https://github.com/sebastian-linden/fue/issues"
changelog = "https://github.com/sebastian-linden/fue/releases"
documentation = "https://sebastian-linden.github.io/fue/"
homepage = "https://github.com/sebastian-linden/fue"

[project.scripts]
fue = "fue.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Third-party library type stubs are incomplete for openmeteo_requests
# Using type: ignore comments to suppress specific issues

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/fue"]
