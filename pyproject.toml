[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly tell Hatchling to include the root config file in the PyPI build
[tool.hatch.build.targets.wheel]
packages = ["src/pyfue"]
shared-data = { "config.json" = "config.json" }

[project]
name = "pyfue"
version = "0.1.1"
description = "Want to know if a weather forecast is reliable? The fue Python package quantifies forecast accuracy by training ML models to predict the absolute error of numerical weather predictions. By analyzing historical performance across custom city sets, it turns abstract forecasts into actionable confidence levels for planning your next trip."
readme = "README.md"
authors = [
  {name = "Sebastian Linden", email = "sebastian.bennet.linden@rwth-aachen.de"}
]
maintainers = [
  {name = "Sebastian Linden", email = "sebastian.bennet.linden@rwth-aachen.de"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "numpy",
  "pandas",
  "openmeteo-requests",
  "requests-cache",
  "retry-requests",
  "seaborn",
  "matplotlib",
  "scikit-learn",
  "scipy",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "docs" }
]
lint = [
    "ruff>=0.15.10",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "nbsphinx>=0.9.8",
    "sphinx",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-bibtex>=2.7.0",
]

[project.urls]
bugs = "https://github.com/sebastian-linden/pyfue/issues"
changelog = "https://github.com/sebastian-linden/pyfue/releases"
documentation = "https://sebastian-linden.github.io/pyfue/"
homepage = "https://github.com/sebastian-linden/pyfue"

[project.scripts]
pyfue = "pyfue.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Third-party library type stubs are incomplete for openmeteo_requests
# Using type: ignore comments to suppress specific issues

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]